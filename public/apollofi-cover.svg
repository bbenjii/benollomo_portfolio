    <g fill="#31577f">
      <rect x="376" y="328" width="42" height="60" rx="6"/>
      <rect x="448" y="286" width="42" height="102" rx="6"/>
      <rect x="520" y="304" width="42" height="84" rx="6"/>
      <rect x="592" y="246" width="42" height="142" rx="6"/>
      <rect x="664" y="266" width="42" height="122" rx="6"/>
      <rect x="736" y="232" width="42" height="156" rx="6"/>
      <rect x="808" y="252" width="42" height="136" rx="6"/>
      <rect x="880" y="218" width="42" height="170" rx="6"/>
