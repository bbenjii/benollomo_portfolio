<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">ApolloFi project cover</title>
  <desc id="description">A dark financial dashboard illustration with charts and the ApolloFi name.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#162a48"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5ea8ff"/>
      <stop offset="1" stop-color="#80e1c1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" rx="36" fill="url(#background)"/>
  <circle cx="1050" cy="90" r="240" fill="#4d8fff" opacity=".08"/>
  <circle cx="120" cy="690" r="260" fill="#55d6ae" opacity=".06"/>
